name: Import website source

on:
  push:
    paths:
      - "website-source.part*"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild and extract the project archive
        shell: bash
        run: |
          set -euo pipefail
          cat website-source.part* > /tmp/cd-website.zip.b64
          base64 --decode /tmp/cd-website.zip.b64 > /tmp/cd-website.zip
          unzip -q /tmp/cd-website.zip -d /tmp/cd-website
          test -f /tmp/cd-website/cd-architectural-design-services/public/index.html
          cp -a /tmp/cd-website/cd-architectural-design-services/. .
          rm -f website-source.part*

      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import complete C + D website source"
          git push
