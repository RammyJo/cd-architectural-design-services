name: Import website source

on:
  push:
    paths:
      - "cd-architectural-design-services.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract website project into the repository
        shell: bash
        run: |
          set -euo pipefail
          unzip -q cd-architectural-design-services.zip -d /tmp/cd-website
          test -f /tmp/cd-website/cd-architectural-design-services/public/index.html
          cp -a /tmp/cd-website/cd-architectural-design-services/. .
          rm -f cd-architectural-design-services.zip

      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import complete C + D website source"
          git push
