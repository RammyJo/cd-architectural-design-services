name: Validate C + D website

on:
  push:
    branches: [main]
    paths:
      - "cd-architectural-design-services/**"
      - ".github/workflows/import-website-source.yml"
  pull_request:
    branches: [main]
    paths:
      - "cd-architectural-design-services/**"
      - ".github/workflows/import-website-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cd-architectural-design-services
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cd-architectural-design-services/package.json

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Verify Cloudflare headers are in the deploy output
        run: test -f dist/_headers
